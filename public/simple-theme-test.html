<!-- Test simplifié du theme switcher -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Theme Switcher Simple</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f1f5f9;
            --accent: #818cf8;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #1e293b;
            --accent: #6366f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 300ms ease;
            padding: 40px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* Theme Toggle Styles */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0.5rem;
            border: 1px solid rgba(129, 140, 248, 0.2);
            margin-bottom: 30px;
            width: fit-content;
        }

        .theme-toggle-btn {
            background: transparent;
            border: none;
            color: rgba(248, 113, 113, 0.7);
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            transition: all 150ms ease;
            border-radius: 0.375rem;
        }

        .theme-toggle-btn:hover {
            color: var(--accent);
            background: rgba(129, 140, 248, 0.1);
        }

        .theme-toggle-btn.active {
            color: var(--accent);
            background: rgba(129, 140, 248, 0.2);
        }

        .status {
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid var(--accent);
            border-radius: 0.5rem;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .status code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
        }

        .test-box {
            background: rgba(129, 140, 248, 0.05);
            border: 2px solid var(--accent);
            border-radius: 0.5rem;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 150ms ease;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Test Theme Switcher</h1>

        <div class="theme-toggle">
            <button class="theme-toggle-btn" data-toggle-theme="dark" title="Mode sombre">🌙</button>
            <button class="theme-toggle-btn" data-toggle-theme="light" title="Mode clair">☀️</button>
        </div>

        <div class="status">
            <div><strong>Theme:</strong> <code id="theme">-</code></div>
            <div><strong>data-theme:</strong> <code id="data-theme">-</code></div>
            <div><strong>localStorage:</strong> <code id="storage">-</code></div>
            <div><strong>Buttons active:</strong> <code id="active">-</code></div>
        </div>

        <div class="test-box">
            <p>✅ Cliquez sur les boutons ci-dessus pour basculer entre les modes</p>
            <p>✅ Les changements doivent être immédiats (300ms transition)</p>
            <p>✅ Rafraîchissez la page - votre thème préféré doit être restauré</p>
            <button onclick="clearTheme()">🗑️ Réinitialiser localStorage</button>
        </div>
    </div>

    <script>
        class SimplethemeSwitcher {
            constructor() {
                this.storageKey = 'app-theme-preference';
                this.init();
            }

            init() {
                console.log('🚀 Initializing theme switcher...');
                this.loadTheme();
                this.setupEvents();
                this.updateStatus();
            }

            loadTheme() {
                const saved = localStorage.getItem(this.storageKey);
                const theme = saved || 'dark';
                console.log(`📥 Loading theme from localStorage: "${theme}"`);
                this.setTheme(theme);
            }

            setTheme(theme) {
                console.log(`🎨 Setting theme to: "${theme}"`);
                const html = document.documentElement;
                
                if (theme === 'light') {
                    html.setAttribute('data-theme', 'light');
                } else {
                    html.removeAttribute('data-theme');
                }
                
                localStorage.setItem(this.storageKey, theme);
                this.updateButtons();
                this.updateStatus();
                console.log(`✅ Theme changed to: "${theme}"`);
            }

            updateButtons() {
                const current = this.getCurrentTheme();
                document.querySelectorAll('[data-toggle-theme]').forEach(btn => {
                    const isActive = btn.getAttribute('data-toggle-theme') === current;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive);
                    console.log(`   Button [${btn.getAttribute('data-toggle-theme')}] active=${isActive}`);
                });
            }

            getCurrentTheme() {
                return document.documentElement.getAttribute('data-theme') || 'dark';
            }

            setupEvents() {
                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-toggle-theme]');
                    if (btn) {
                        const theme = btn.getAttribute('data-toggle-theme');
                        console.log(`👆 User clicked button: "${theme}"`);
                        this.setTheme(theme);
                    }
                });
            }

            updateStatus() {
                const theme = this.getCurrentTheme();
                const dataAttr = document.documentElement.getAttribute('data-theme') || '(none)';
                const storage = localStorage.getItem(this.storageKey) || '(none)';
                const active = Array.from(document.querySelectorAll('[data-toggle-theme]'))
                    .filter(btn => btn.classList.contains('active'))
                    .map(btn => btn.getAttribute('data-toggle-theme'))
                    .join(', ');

                document.getElementById('theme').textContent = theme;
                document.getElementById('data-theme').textContent = dataAttr;
                document.getElementById('storage').textContent = storage;
                document.getElementById('active').textContent = active || '(none)';
            }
        }

        function clearTheme() {
            localStorage.removeItem('app-theme-preference');
            location.reload();
        }

        // Initialize
        const switcher = new SimplethemeSwitcher();
        window.testThemeSwitcher = switcher;
    </script>
</body>
</html>
